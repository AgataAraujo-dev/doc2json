[project]
name = 'doc2json'
version = '0.1.0'
description = 'Transforma PDF, Word e Excel em JSON validado usando um LLM'
requires-python = '>=3.10'
dependencies = [
    'pydantic>=2.5',
    'pypdf>=4.0',
    'python-docx>=1.1',
    'openpyxl>=3.1',
    'pyyaml>=6.0',
    'typer>=0.12',
]

[project.optional-dependencies]
bedrock = ['boto3>=1.34']
dev = ['pytest>=8.0', 'ruff>=0.5']

[project.scripts]
doc2json = 'doc2json.cli:app'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/doc2json']

[tool.ruff.lint]
ignore = ['B008']  # Typer usa chamadas de função em defaults por design
